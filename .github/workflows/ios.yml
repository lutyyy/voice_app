name: iOS App

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  core-tests:
    name: 剪輯邏輯單元測試（Linux）
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        working-directory: ios/AutoCutCore
        run: swift test

  build-app:
    name: 編譯 iOS App（產生未簽章 IPA）
    needs: core-tests
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 選用最新的 Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: 安裝 XcodeGen 並產生專案
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: 快取 Swift 套件
        uses: actions/cache@v4
        with:
          path: ios/build/SourcePackages
          key: spm-${{ hashFiles('ios/project.yml') }}
      - name: 編譯（不簽章）
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project VoiceCut.xcodeproj -scheme VoiceCut -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build -clonedSourcePackagesDirPath build/SourcePackages \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error:|warning: .*VoiceCut|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/VoiceCut.app
      - name: 打包 IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/VoiceCut.app Payload/
          zip -qry VoiceCut-unsigned.ipa Payload
          ls -lh VoiceCut-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceCut-unsigned-ipa
          path: ios/VoiceCut-unsigned.ipa
          retention-days: 30
      - name: 上傳編譯紀錄（失敗時）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/build.log
