# XcodeGen 設定：在 Mac 上執行 `xcodegen generate` 產生 VoiceCut.xcodeproj（CI 會自動做）
name: VoiceCut
options:
  bundleIdPrefix: com.lutyyy
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hant

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: 1.1.0
  AutoCutCore:
    path: AutoCutCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  VoiceCut:
    type: application
    platform: iOS
    sources:
      - path: VoiceCut
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: WhisperKit
        product: SpeakerKit
      - package: AutoCutCore
        product: AutoCutCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lutyyy.voicecut
        PRODUCT_NAME: VoiceCut
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    info:
      path: VoiceCut/Info.plist
      properties:
        # Apple 的 App ID 名稱只接受英文與數字（SideStore 等工具會用它建立 App ID），
        # 中文名稱放在 zh-Hant.lproj/InfoPlist.strings，桌面上仍顯示「語音剪輯」
        CFBundleDisplayName: VoiceCut
        CFBundleName: VoiceCut
        CFBundleDevelopmentRegion: zh-Hant
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        # 剪好的檔案也能在「檔案」App 的「我的 iPhone › 語音剪輯」看到
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        ITSAppUsesNonExemptEncryption: false
        # 讓其他 App 的「分享」選單可以把影音檔丟給本 App
        CFBundleDocumentTypes:
          - CFBundleTypeName: 音訊
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio]
          - CFBundleTypeName: 影片
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie]
